review_type: structured_narrative_evidence_map
status: prospective_protocol_for_next_revision
last_updated: 2026-09-10
protocol_version: 2026-09-10.2
registration:
  status: not_registered
  rule: Registration must occur before definitive screening; a later registration must be labelled retrospective.
review_question:
  primary: Which medical detection systems use current observations to change subsequent physical acquisition, interaction, sampling, verification, routing, or stopping, and what evidence supports their clinical translation?
  secondary:
    - Which systems close strategic, execution, verification, or human-mediated loops?
    - How do action consequence and execution authority constrain permissible adaptation?
    - Which technical, diagnostic, safety, workflow, human-factor, and patient-benefit outcomes have been evaluated?
unit_of_analysis:
  primary: study_report
  secondary: embodied_system
  warning: Multiple papers about one system must not be counted as independent systems.
scope:
  population: Human participants, clinically relevant specimens, anatomical models, or diagnostic environments
  concept: Observation-conditioned physical acquisition, interaction, sampling, verification, routing, or stopping for a diagnostic objective
  contexts:
    - clinical_detection_and_intervention
    - laboratory_diagnostics_and_assay_development
    - everyday_monitoring_and_adaptive_support
  definitive_search_dates: database_inception_to_final_search_date
  current_public_snapshot_dates: 2000-01-01_to_2026-09-10
  language: no_language_restriction_at_search; translation feasibility recorded during screening
  publication_status: peer-reviewed reports and preprints retrieved; versions linked and analysed without double counting
inclusion_requires:
  - diagnostic_objective
  - physical_patient_specimen_instrument_or_environment_interaction
  - current_observation_changes_a_subsequent_diagnostic_action
exclusion_examples:
  - static_interpretation_of_a_completed_dataset
  - fixed_trajectory_or_script_without_observation_conditioned_change
  - therapeutic_control_without_diagnostic_information_acquisition
  - general_robotic_surgery_without_diagnostic_acquisition
evidence_roles:
  - core_integrated_loop
  - core_human_mediated_loop
  - enabling_component
  - adjacent_precedent
  - excluded
evidence_stages:
  - simulation
  - bench_or_phantom
  - ex_vivo
  - animal
  - healthy_volunteer_feasibility
  - patient_feasibility
  - prospective_comparative
  - randomized_trial
  - monitored_deployment
analysis_rules:
  - Report a denominator and screening stage for every count.
  - Separate papers, studies, systems, participants, specimens, and procedures.
  - Do not pool task-success rates across heterogeneous diagnostic actions.
  - Do not infer missing sample sizes, identifiers, outcomes, or autonomy levels.
  - Keep multi-label directions but use one prespecified primary direction for plots.
  - Treat automated relevance labels as screening aids, never inclusion decisions.
  - Separate within-action feedback from authority to repeat an invasive action.
  - Report missingness and not-reported values explicitly.
  - Machine labels may order work but may not remove records from human screening without a prespecified validated automation study.
  - Preserve exact source locations for every extracted numerical or categorical claim.
  - Keep the representative evidence seed separate from the final included-study corpus.
screening_process:
  title_abstract: two independent named reviewers followed by adjudication of disagreements
  full_text: two independent named reviewers with one prespecified exclusion reason per excluded report
  machine_assistance: prioritization_only
  reviewer_independence: reviewer identifiers must differ
data_extraction:
  process: piloted form followed by duplicate extraction or independent verification
  identity_levels:
    - report_id
    - study_id
    - system_id
  provenance_required:
    - source_url_or_local_document_id
    - page_table_figure_or_section
    - exact_supporting_text_or_structured_value
    - extractor_id
    - verifier_id
    - verification_date
synthesis_plan:
  default: structured qualitative synthesis with explicit grouping by diagnostic direction and evidence stage
  descriptive_counts: report study and system denominators separately
  meta_analysis: only after clinical and statistical compatibility is established prospectively
  heterogeneous_outcomes: follow a synthesis-without-meta-analysis reporting structure
  certainty: assess only for clearly defined outcome-level bodies of evidence
amendments:
  - date: 2026-09-10
    version: 2026-09-10.2
    change: Added all-record human screening, explicit reviewer independence, report-study-system linkage, source-location provenance, and publication-readiness gates.
    timing: prospective for the next definitive review cycle; retrospective relative to the existing representative seed
required_for_systematic_review_claim:
  - validated_database_specific_searches
  - subscription_database_exports_where_available
  - duplicate_independent_title_abstract_screening
  - duplicate_independent_full_text_screening
  - full_text_exclusion_reasons
  - backward_and_forward_citation_chasing
  - risk_of_bias_or_quality_assessment
  - prisma_flow
