name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser requests pyyaml
      - run: python scripts/validate_repository.py
      - run: python scripts/validate_review_workflow.py --run-id 2026-09-10-public-v3
      - run: python -m unittest discover -s tests
