name: Daily Paper Radar
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/discover.py --days 3
      - run: python scripts/validate_embodied_diagnostics.py
      - run: python scripts/build_digest.py
      - name: Build current homepage artifact
        run: python scripts/build_site.py
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "radar: daily embodied diagnostics candidates"
          branch: radar/daily-embodied-diagnostics
          delete-branch: true
          title: "Radar: daily embodied diagnostics candidates"
          body: "Automated candidates from arXiv, OpenAlex, and Crossref. Review `data/search_audit.json` before promotion."
          labels: radar,candidates
          add-paths: |
            data/inbox.jsonl
            data/daily-summary.md
            data/search_audit.json
