<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><rect width="1600" height="650" fill="white"/><text x="45" y="52" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#25152B">Highest publicly verifiable evidence maturity</text><line x1="480.0" y1="78" x2="480.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="480.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Not located</text><line x1="655.0" y1="78" x2="655.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="655.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Prototype</text><line x1="830.0" y1="78" x2="830.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="830.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Phantom / in vitro</text><line x1="1005.0" y1="78" x2="1005.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="1005.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Animal / ex vivo</text><line x1="1180.0" y1="78" x2="1180.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="1180.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Human</text><line x1="1355.0" y1="78" x2="1355.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="1355.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Multicentre / controlled</text><line x1="1530.0" y1="78" x2="1530.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="1530.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Outcome / deployment</text><text x="460" y="141.5" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#25152B">Percutaneous / core-needle biopsy</text><line x1="480" y1="134.5" x2="1005.0" y2="134.5" stroke="#E8E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1005.0" cy="134.5" r="16" fill="#D9782D" stroke="white" stroke-width="3"/><text x="460" y="230.5" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#25152B">Venipuncture / blood collection</text><line x1="480" y1="223.5" x2="1355.0" y2="223.5" stroke="#E8E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1355.0" cy="223.5" r="16" fill="#2C8068" stroke="white" stroke-width="3"/><text x="460" y="319.5" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#25152B">Swab / specimen collection</text><line x1="480" y1="312.5" x2="1180.0" y2="312.5" stroke="#E8E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1180.0" cy="312.5" r="16" fill="#2C8068" stroke="white" stroke-width="3"/><text x="460" y="408.5" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#25152B">Endoscopic / bronchoscopic biopsy</text><line x1="480" y1="401.5" x2="1355.0" y2="401.5" stroke="#E8E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1355.0" cy="401.5" r="16" fill="#2C8068" stroke="white" stroke-width="3"/><text x="460" y="497.5" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#25152B">Capsule tissue / fluid sampling</text><line x1="480" y1="490.5" x2="1005.0" y2="490.5" stroke="#E8E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1005.0" cy="490.5" r="16" fill="#D9782D" stroke="white" stroke-width="3"/><text x="45" y="625" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6D6470">Highest evidence level located in publicly verifiable primary studies; it does not imply full-loop autonomy and is not a publication-volume metric.</text></svg>