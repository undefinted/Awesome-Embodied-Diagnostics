<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><rect width="1600" height="650" fill="white"/><text x="45" y="52" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#25152B">Highest publicly verifiable evidence maturity</text><line x1="480.0" y1="78" x2="480.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="480.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Not located</text><line x1="655.0" y1="78" x2="655.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="655.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Prototype</text><line x1="830.0" y1="78" x2="830.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="830.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Phantom / in vitro</text><line x1="1005.0" y1="78" x2="1005.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="1005.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Animal / ex vivo</text><line x1="1180.0" y1="78" x2="1180.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="1180.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Human</text><line x1="1355.0" y1="78" x2="1355.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="1355.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Multicentre / controlled</text><line x1="1530.0" y1="78" x2="1530.0" y2="550" stroke="#E8E1EA" stroke-dasharray="5 7"/><text x="1530.0" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6D6470">Outcome / deployment</text><text x="460" y="134.08333333333334" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="2