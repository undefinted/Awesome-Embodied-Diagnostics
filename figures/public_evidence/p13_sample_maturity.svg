<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650"><rect width="1500" height="650" fill="white"/><text x="45" y="52" font-family="Microsoft YaHei,Arial" font-size="31" font-weight="700" fill="#2B1532">可公开核验的最高证据成熟度</text><line x1="300" y1="78" x2="300" y2="550" stroke="#E7E1EA" stroke-dasharray="5 7"/><text x="300" y="583" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">未定位</text><line x1="485" y1="78" x2="485" y2="550" stroke="#E7E1EA" stroke-dasharray="5 7"/><text x="485" y="583" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">原型</text><line x1="670" y1="78" x2="670" y2="550" stroke="#E7E1EA" stroke-dasharray="5 7"/><text x="670" y="583" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">幻模/体外</text><line x1="855" y1="78" x2="855" y2="550" stroke="#E7E1EA" stroke-dasharray="5 7"/><text x="855" y="583" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">动物/离体</text><line x1="1040" y1="78" x2="1040" y2="550" stroke="#E7E1EA" stroke-dasharray="5 7"/><text x="1040" y="583" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">人体</text><line x1="1225" y1="78" x2="1225" y2="550" stroke="#E7E1EA" stroke-dasharray="5 7"/><text x="1225" y="583" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">多中心/对照</text><line x1="1410" y1="78" x2="1410" y2="550" stroke="#E7E1EA" stroke-dasharray="5 7"/><text x="1410" y="583" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">结局/部署</text><text x="280" y="141.5" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">经皮活检</text><line x1="300" y1="134.5" x2="855" y2="134.5" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="855" cy="134.5" r="16" fill="#D9782D" stroke="white" stroke-width="3"/><text x="280" y="230.5" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">采血</text><line x1="300" y1="223.5" x2="1225" y2="223.5" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1225" cy="223.5" r="16" fill="#2E7D65" stroke="white" stroke-width="3"/><text x="280" y="319.5" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">拭子</text><line x1="300" y1="312.5" x2="1040" y2="312.5" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1040" cy="312.5" r="16" fill="#2E7D65" stroke="white" stroke-width="3"/><text x="280" y="408.5" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">内镜活检</text><line x1="300" y1="401.5" x2="1225" y2="401.5" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1225" cy="401.5" r="16" fill="#2E7D65" stroke="white" stroke-width="3"/><text x="280" y="497.5" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">胶囊采样</text><line x1="300" y1="490.5" x2="855" y2="490.5" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="855" cy="490.5" r="16" fill="#D9782D" stroke="white" stroke-width="3"/><text x="45" y="625" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">成熟度取当前可公开核验的一手研究最高层级；不代表完整闭环自治，也不与论文数量等价。</text></svg>