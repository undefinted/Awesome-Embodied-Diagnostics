82D" stroke="white" stroke-width="3"/><text x="280" y="208.25000000000003" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">弹性测绘</text><line x1="300" y1="201.25000000000003" x2="855" y2="201.25000000000003" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="855" cy="201.25000000000003" r="16" fill="#D9782D" stroke="white" stroke-width="3"/><text x="280" y="282.4166666666667" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">TMS 映射</text><line x1="300" y1="275.4166666666667" x2="1040" y2="275.4166666666667" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1040" cy="275.4166666666667" r="16" fill="#2E7D65" stroke="white" stroke-width="3"/><text x="280" y="356.5833333333333" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">关节激发</text><line x1="300" y1="349.5833333333333" x2="1040" y2="349.5833333333333" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1040" cy="349.5833333333333" r="16" fill="#2E7D65" stroke="white" stroke-width="3"/><text x="280" y="430.75" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">痉挛评估</text><line x1="300" y1="423.75" x2="1040" y2="423.75" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="1040" cy="423.75" r="16" fill="#2E7D65" stroke="white" stroke-width="3"/><text x="280" y="504.9166666666667" text-anchor="end" font-family="Microsoft YaHei,Arial" font-size="22" fill="#2B1532">叩诊/反射</text><line x1="300" y1="497.9166666666667" x2="300" y2="497.9166666666667" stroke="#E7E1EA" stroke-width="8" stroke-linecap="round"/><circle cx="300" cy="497.9166666666667" r="16" fill="#D9782D" stroke="white" stroke-width="3"/><text x="45" y="625" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6D6170">成熟度取当前可公开核验的一手研究最高层级；不代表完整闭环自治，也不与论文数量等价。</text></svg>