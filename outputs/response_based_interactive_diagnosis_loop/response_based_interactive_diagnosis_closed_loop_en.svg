  <text x="72" y="76" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="750" font-style="normal" fill="#24182B"><tspan x="72" dy="0">Response-based interactive diagnosis</tspan></text>
  <text x="72" y="118" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" font-style="normal" fill="#6F6874"><tspan x="72" dy="0">Closed-loop acquisition of diagnostic evidence from controlled physical or physiological responses</tspan></text>
  <line x1="72" y1="145" x2="1848" y2="145" stroke="#DCD7E0" stroke-width="2"/>

