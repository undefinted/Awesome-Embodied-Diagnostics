  <rect x="1480" y="166" width="368" height="34" rx="17" fill="#EDF7F4"/>
  <text x="1664" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F8974"><tspan x="1664" dy="0">EMBODIED INTERACTION</tspan></text>

  
