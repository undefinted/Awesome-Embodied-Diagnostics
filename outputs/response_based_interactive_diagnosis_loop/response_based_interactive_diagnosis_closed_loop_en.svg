  <g filter="url(#shadow)">
    
    <g>
      <rect x="80" y="210" width="270" height="190" rx="16" fill="#FFFFFF" stroke="#DCD7E0" stroke-width="2"/>
      <rect x="80" y="210" width="8" height="190" rx="4" fill="#642078"/>
